<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Inter:wght@600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root{--cream:#EFEAE0;--terra:#C97B58;--terra-deep:#B8654A;--ink:#1C1712;--blush:#E7D6CB;--sand:#E3DACC;--line:#ddd2c1;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{margin:0}
  .hero{width:1200px;height:630px;background:var(--cream);position:relative;overflow:hidden;
    background-image:radial-gradient(rgba(28,23,18,.02) 1.4px,transparent 1.4px);background-size:6px 6px;
    display:flex;align-items:center;padding:0 70px;font-family:'Inter',sans-serif}
  .left{flex:1;max-width:680px}
  .kick{display:inline-block;background:var(--blush);color:#7a4a34;font-family:'JetBrains Mono',monospace;font-weight:700;
    font-size:17px;letter-spacing:2px;text-transform:uppercase;padding:9px 16px;border-radius:8px;margin-bottom:24px}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:64px;line-height:1.04;color:var(--ink);letter-spacing:-.01em}
  h1 em{font-style:italic;color:var(--terra)}
  .sub{font-family:'Fraunces',serif;font-style:italic;font-size:26px;color:#6b5c50;margin-top:18px}
  .thumbs{display:flex;gap:12px;margin-top:34px}
  .thumbs .t{width:58px;height:74px;border-radius:8px;background:var(--sand);border:1px solid var(--line);position:relative}
  .thumbs .t::after{content:"";position:absolute;left:9px;right:9px;top:11px;height:5px;border-radius:3px;background:#cdbfa8}
  .thumbs .t::before{content:"";position:absolute;left:9px;right:20px;bottom:11px;height:5px;border-radius:3px;background:#cdbfa8}
  .thumbs .t.on{background:var(--terra);border-color:var(--terra-deep)}
  .thumbs .t.on::after,.thumbs .t.on::before{background:rgba(255,255,255,.6)}
  .right{width:360px;display:flex;align-items:flex-end;justify-content:center;position:relative;height:100%}
  .char{width:360px;image-rendering:pixelated;margin-bottom:10px;filter:drop-shadow(0 10px 22px rgba(28,23,18,.18))}
  .glow{position:absolute;right:40px;bottom:0;width:340px;height:340px;border-radius:50%;
    background:radial-gradient(closest-side, rgba(201,123,88,.20), transparent);z-index:0}
  .handle{position:absolute;bottom:34px;left:70px;font-family:'Inter',sans-serif;font-weight:700;font-size:18px;color:var(--ink)}
</style>
</head>
